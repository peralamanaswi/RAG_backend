services:
  - type: web
    name: rag-legal-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: EMBEDDING_BACKEND
        value: onnx
      - key: CHROMA_ADD_BATCH_SIZE
        value: "32"
      - key: ENABLE_RERANKER
        value: "false"
      - key: ENABLE_BM25
        value: "false"
      - key: ENABLE_OCR
        value: "false"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_PROJECT
        value: legal-document-explainer-backend
